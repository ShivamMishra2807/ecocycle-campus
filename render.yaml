services:
  - type: web
    name: ecocycle-campus-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run db:generate --workspace=packages/database && npm run db:push --workspace=packages/database && npm run db:seed --workspace=packages/database && npm run build --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
