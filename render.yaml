services:
  - type: web
    name: ecocycle-campus-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:server
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
